<svg id="gh-dark-mode-only" width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 14px;
  line-height: 21px;
}
#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #141321;
  stroke: #fe428e;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}
#gh-dark-mode-only:target #background {
  fill: #141321;
  stroke: #fe428e;
  stroke-width: 1px;
}
foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}
h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #fe428e;
  fill: #fe428e;
}
#gh-dark-mode-only:target h2 {
  color: #fe428e;
  fill: #fe428e;
}
ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}
li {
  display: inline-flex;
  font-size: 12px;
  margin-right: 1ch;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(-500%);
  animation: slideIn 2s ease-in-out forwards;
}
@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}
div.ellipsis {
  height: 176px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.octicon {
  fill: #f8d847;
  margin-right: 0.5ch;
  vertical-align: top;
}
#gh-dark-mode-only:target .octicon {
  fill: #f8d847;
}
.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: #2c2b3d;
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 1em;
}
#gh-dark-mode-only:target .progress {
  background-color: #2c2b3d;
}
.progress-item {
  outline: 2px solid #f8d847;
  border-collapse: collapse;
}
#gh-dark-mode-only:target .progress-item {
  outline: 2px solid #f8d847;
}
.lang {
  font-weight: 600;
  margin-right: 4px;
  color: #a9fef7;
}
#gh-dark-mode-only:target .lang {
  color: #a9fef7;
}
.percent {
  color: #a9fef7;
}
#gh-dark-mode-only:target .percent {
  color: #a9fef7;
}
</style>
<g>
<rect x="5" y="5" id="background" />
<g>
<foreignObject x="21" y="17" width="318" height="176">
<div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">

<h2>Languages Used (By File Size)</h2>

<div>
<span class="progress">
{{ progress }}
</span>
</div>

<ul>

{{ lang_list }}

</ul>

</div>
</foreignObject>
</g>
</g>
</svg>
